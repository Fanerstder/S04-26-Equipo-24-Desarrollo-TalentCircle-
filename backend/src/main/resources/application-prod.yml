spring:
  datasource:
    url: jdbc:h2:mem:talentcircle_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  llm:
    provider: ${LLM_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY}
      model: ${OPENAI_MODEL:gpt-4-turbo}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      model: ${ANTHROPIC_MODEL:claude-3-sonnet-20240229}

  linkedin:
    access-token: ${LINKEDIN_ACCESS_TOKEN}
    person-id: ${LINKEDIN_PERSON_ID}

logging:
  level:
    com.talentcircle: INFO
    org.springframework: WARN
    org.hibernate: WARN